services:
  postgres:
    image: postgres:16-alpine
    container_name: condotrack-postgres
    restart: always
    environment:
      POSTGRES_DB: condotrack_db
      POSTGRES_USER: condotrack_user
      POSTGRES_PASSWORD: condotrack_pass
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U condotrack_user -d condotrack_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  mailpit:
    image: axllent/mailpit:latest
    container_name: condotrack-mailpit
    restart: always
    ports:
      - "1025:1025" # SMTP Port
      - "8025:8025" # Web UI: http://localhost:8025

  backend:
    image: condotrack-backend:latest
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: condotrack-backend
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/condotrack_db
      SPRING_DATASOURCE_USERNAME: condotrack_user
      SPRING_DATASOURCE_PASSWORD: condotrack_pass
      SPRING_MAIL_HOST: mailpit
      SPRING_MAIL_PORT: 1025
      JWT_SECRET: supersecretjwtkeythatisatleast256bitslong1234567890
      CORS_ALLOWED_ORIGINS: "http://localhost:3000,http://127.0.0.1:3000,http://localhost:8080,https://localhost,https://127.0.0.1"
    ports:
      - "8080:8080"

  frontend:
    image: condotrack-frontend:latest
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: condotrack-frontend
    restart: always
    depends_on:
      - backend
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8080/api/v1
    ports:
      - "3000:3000"

  # Proxy Reverso para Terminação TLS/HTTPS (RNF-01 - Criptografia em Trânsito)
  reverse-proxy:
    image: nginx:alpine
    container_name: condotrack-proxy
    restart: always
    depends_on:
      - backend
      - frontend
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./docker/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./docker/nginx/certs:/etc/nginx/certs:ro

volumes:
  postgres_data:
